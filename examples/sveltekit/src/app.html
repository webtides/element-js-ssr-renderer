<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!--
      A global stylesheet. Shadow-DOM components (el-button, el-notification,
      x-counter) ADOPT it into their shadow roots during SSR — element-js'
      `adoptGlobalStyles` behavior, which the renderer mirrors — and the `--el-*`
      design tokens on :root also inherit through the shadow boundary.

      It lives in app.html (not a Svelte component) so it's plain, static CSS the
      renderer can see and adopt — Svelte's component <style> is scoped and would
      not be a document-global stylesheet.
    -->
    <style>
      :root {
        color-scheme: light dark;

        /* element-library design tokens (a small hand-picked subset). */
        --el-color-fg: light-dark(#111827, #f3f4f6);
        --el-color-fg-muted: light-dark(#6b7280, #9ca3af);
        --el-color-bg: light-dark(#ffffff, #14171c);
        --el-color-bg-muted: light-dark(#f3f4f6, #1c1f24);
        --el-color-border: light-dark(#d1d5db, #2d3138);
        --el-color-accent: light-dark(#2563eb, #60a5fa);
        --el-color-on-accent: #ffffff;
        --el-space-2: 0.5rem;
        --el-space-3: 0.75rem;
        --el-space-4: 1rem;
        --el-radius-sm: 0.375rem;
        --el-radius-md: 0.5rem;
        --el-radius-lg: 0.75rem;
        --el-font-sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }

      body {
        margin: 0;
        padding: var(--el-space-4);
        font-family: var(--el-font-sans);
        line-height: 1.5;
        color: var(--el-color-fg);
        background: var(--el-color-bg);
      }

      main {
        max-width: 52rem;
        margin: 0 auto;
      }

      section {
        margin-block: 2rem;
        padding: var(--el-space-4);
        border: 1px solid var(--el-color-border);
        border-radius: var(--el-radius-lg);
      }

      h1 {
        font-size: 1.75rem;
      }

      .row {
        display: flex;
        flex-wrap: wrap;
        gap: var(--el-space-3);
        align-items: center;
      }

      code {
        padding: 0.1em 0.35em;
        border-radius: var(--el-radius-sm);
        background: var(--el-color-bg-muted);
        font-size: 0.9em;
      }
    </style>
    %sveltekit.head%
  </head>
  <body>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
